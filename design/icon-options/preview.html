<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Relay 图标方案</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f6f7f8;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:1280px;height:720px;padding:46px 54px;background:radial-gradient(ellipse at 85% 7%,#1b2739 0,transparent 48%),#0b0d10}h1{font-size:30px;letter-spacing:-.025em;margin:0 0 5px}p{color:#9ba4b2;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:35px}.card{height:500px;background:#15191e;border:1px solid #2a303a;border-radius:25px;padding:25px}.large{display:block;width:180px;height:180px;margin:15px auto 25px;box-shadow:0 12px 30px #0009;border-radius:40px}.num{color:#82b1ff;font-size:12px;font-weight:700;letter-spacing:.14em}h2{font-size:21px;margin:5px 0 7px}small{font-size:13px;color:#9ba4b2;display:block;min-height:44px}.sample{margin-top:23px;padding:17px 14px;background:#0d1014;border-radius:18px;display:flex;align-items:center;gap:14px;color:#d3d7df;font-size:13px}.sample img{width:60px;height:60px;border-radius:14px}.note{margin-top:21px;font-size:13px;color:#8390a2}
  </style>
</head>
<body>
<main>
  <h1>Agent Relay · 桌面图标方案</h1>
  <p>每款都是独立矢量图；下方小图展示接近 iPhone 桌面上的辨识度。</p>
  <div class="grid">
    <section class="card"><img class="large" src="01-relay-nodes.svg"><div class="num">A / RELAY</div><h2>接力路径</h2><small>一条连接路径与终点，强调远程接力。</small><div class="sample"><img src="01-relay-nodes.svg">Agent Relay</div></section>
    <section class="card"><img class="large" src="02-chat-link.svg"><div class="num">B / CHAT</div><h2>对话连接</h2><small>对话气泡加向前箭头，突出会话。</small><div class="sample"><img src="02-chat-link.svg">Agent Relay</div></section>
    <section class="card"><img class="large" src="03-dual-flow.svg"><div class="num">C / FLOW</div><h2>双向流转</h2><small>双向箭头，突出设备间消息往返。</small><div class="sample"><img src="03-dual-flow.svg">Agent Relay</div></section>
    <section class="card"><img class="large" src="04-signal.svg"><div class="num">D / HUB</div><h2>信号中继</h2><small>四个端点围绕中继核心，强调连接。</small><div class="sample"><img src="04-signal.svg">Agent Relay</div></section>
  </div>
  <div class="note">预览保留深色底色，便于在浅色和深色壁纸上识别。</div>
</main>
</body>
</html>
