server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    # nginx >= 1.25.1; multiplex SSE and page requests across browser tabs.
    http2 on;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/agent-relay-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-relay-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css text/javascript application/javascript;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agent_relay_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
